name: API CI — Build & Quality Checks

# Path-filtered so the API pipeline is independent of the mobile one: a change
# touching only apps/mobile never queues these jobs, and when a change touches
# both, the two workflows run side by side rather than in sequence.
on:
  push:
    branches:
      - main
      - feat/ticket-reservation
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/api-ci.yml'
      - '.github/actions/setup-node-and-pnpm/**'
      - '.github/actions/setup-docker/**'
      - '.github/actions/setup-railway/**'
  pull_request:
    branches:
      - main
      - feat/ticket-reservation
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/api-ci.yml'
      - '.github/actions/setup-node-and-pnpm/**'
      - '.github/actions/setup-docker/**'
      - '.github/actions/setup-railway/**'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Format check
        run: pnpm --filter @movea/api format:check

      - name: Lint
        run: pnpm --filter @movea/api lint:check

  security:
    name: Verify Package Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Audit dependencies
        run: |
          if ! pnpm audit --audit-level high; then
            echo "::warning::Security vulnerabilities found in dependencies. Please review and update affected packages."
            exit 0
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Run unit tests
        run: pnpm --filter @movea/api test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Build workspace dependencies
        run: pnpm --filter @movea/api-contract build

      - name: Build
        run: pnpm --filter @movea/api build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: ./.github/actions/setup-docker
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/ticket-reservation
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      # Context is the workspace root: the image needs the root lockfile and
      # pnpm-workspace.yaml to resolve @movea/api and its workspace deps.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-${{ github.ref_name }}
          cache-to: type=gha,scope=api-${{ github.ref_name }},mode=max

  # The Railway service deploys the image pushed above, not the GitHub source,
  # so a redeploy is what pulls the new tag. Runs only after the push succeeds.
  deploy:
    name: Deploy API — Railway
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Railway CLI
        uses: ./.github/actions/setup-railway

      - name: Validate required environment variables
        run: |
          MISSING=()
          [[ -z "$RAILWAY_TOKEN" ]] && MISSING+=("RAILWAY_TOKEN (secret)")
          [[ -z "$RAILWAY_SERVICE" ]] && MISSING+=("RAILWAY_SERVICE (variable)")
          [[ -z "$RAILWAY_ENVIRONMENT" ]] && MISSING+=("RAILWAY_ENVIRONMENT (variable)")
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "::error::Missing required environment variables:"
            for VAR in "${MISSING[@]}"; do
              echo "::error::  - $VAR"
            done
            exit 1
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}

      - name: Trigger Railway redeploy
        run: railway redeploy --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
