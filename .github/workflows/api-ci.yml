name: API CI — Build & Quality Checks

# Path-filtered so the API pipeline is independent of the mobile one: a change
# touching only apps/mobile never queues these jobs, and when a change touches
# both, the two workflows run side by side rather than in sequence.
on:
  push:
    branches:
      - main
      - dev
      - stag
      - production
      - feat/ticket-reservation
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/api-deploy.yml'
      - '.github/actions/setup-node-and-pnpm/**'
  pull_request:
    branches:
      - main
      - dev
      - stag
      - production
      - feat/ticket-reservation
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/api-ci.yml'
      - '.github/workflows/api-deploy.yml'
      - '.github/actions/setup-node-and-pnpm/**'

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Format check
        run: pnpm --filter @movea/api format:check

      - name: Lint
        run: pnpm --filter @movea/api lint:check

  security:
    name: Verify Package Security
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Audit dependencies
        run: |
          if ! pnpm audit --audit-level high; then
            echo "::warning::Security vulnerabilities found in dependencies. Please review and update affected packages."
            exit 0
          fi

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Run unit tests
        run: pnpm --filter @movea/api test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm workspace
        uses: ./.github/actions/setup-node-and-pnpm

      - name: Build workspace dependencies
        run: pnpm --filter @movea/api-contract build

      - name: Build
        run: pnpm --filter @movea/api build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker
        uses: ./.github/actions/setup-docker
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/ticket-reservation
          # :latest is what the Railway service pulls, and every branch in the
          # trigger list moves it — last push wins, so a merge to dev deploys
          # to the same service main does. The immutable sha- tag is the way
          # back: point the service at one to pin a known-good build.
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest

      # Context is the workspace root: the image needs the root lockfile and
      # pnpm-workspace.yaml to resolve @movea/api and its workspace deps.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api-${{ github.ref_name }}
          cache-to: type=gha,scope=api-${{ github.ref_name }},mode=max

  # Gated on docker, which is itself gated on quality/test/build: a red test
  # job means no image push, and no image push means no deploy. The same
  # workflow can be dispatched by hand to redeploy without rebuilding.
  #
  # Every branch that pushes an image also deploys, because every branch moves
  # :latest. Deploys queue rather than cancel (see api-deploy.yml), so two
  # branches landing at once roll out in order instead of interleaving.
  deploy:
    name: Deploy to Railway
    needs: [docker]
    if: github.event_name == 'push'
    uses: ./.github/workflows/api-deploy.yml
    secrets: inherit
